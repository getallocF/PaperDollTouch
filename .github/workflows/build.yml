name: Build PaperDollTouch

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Android SDK & NDK 28.2.13676358
        shell: bash
        run: |
          set -eu
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"
          fi
          echo "Using sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platform-tools" "platforms;android-28" "ndk;28.2.13676358"

          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y ninja-build binutils zip unzip

      - name: Build PaperDollTouch arm64-v8a package
        shell: pwsh
        run: ./scripts/package.ps1 -Abi arm64-v8a

      - name: Verify ELF ARM64 & Package Integrity
        shell: bash
        run: |
          set -eu
          mkdir -p dist
          cp build-arm64-v8a/PaperDollTouch.levipack dist/PaperDollTouch.levipack
          cp build-arm64-v8a/PaperDollTouch-1.0.0-arm64-v8a.levipack dist/PaperDollTouch-1.0.0-arm64-v8a.levipack
          cp build-arm64-v8a/package/PaperDollTouch/libPaperDollTouch.so dist/libPaperDollTouch.so
          cp build-arm64-v8a/package/PaperDollTouch/manifest.json dist/manifest.json

          echo "=== ELF Header Verification ===" | tee dist/ELF_VERIFICATION.txt
          file dist/libPaperDollTouch.so | tee -a dist/ELF_VERIFICATION.txt
          readelf -h dist/libPaperDollTouch.so | tee -a dist/ELF_VERIFICATION.txt
          readelf -h dist/libPaperDollTouch.so | grep -q "AArch64"

          echo "=== Dynamic Symbol & String Audit ===" | tee -a dist/ELF_VERIFICATION.txt
          readelf -Ws dist/libPaperDollTouch.so | grep -E "PLGetModRegistration|NativeMod" | tee -a dist/ELF_VERIFICATION.txt || true
          if strings dist/libPaperDollTouch.so | grep -q "clange_me"; then
            echo "ERROR: Template string clange_me still present in binary!" >&2
            exit 1
          fi
          strings dist/libPaperDollTouch.so | grep -E "PaperDollTouch|LivePlayerRenderer|PaperDollRenderer|DataDrivenRenderer" | head -n 30 | tee -a dist/ELF_VERIFICATION.txt || true

          echo "=== .levipack Archive Contents ===" | tee -a dist/ELF_VERIFICATION.txt
          unzip -l dist/PaperDollTouch.levipack | tee -a dist/ELF_VERIFICATION.txt

      - name: Upload PaperDollTouch Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PaperDollTouch
          path: |
            dist/PaperDollTouch.levipack
            dist/PaperDollTouch-1.0.0-arm64-v8a.levipack
            dist/libPaperDollTouch.so
            dist/manifest.json
            dist/ELF_VERIFICATION.txt

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PaperDollTouch.levipack
            dist/PaperDollTouch-1.0.0-arm64-v8a.levipack
            dist/libPaperDollTouch.so
